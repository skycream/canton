version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: canton_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CANTON_DB_USER:-canton}
      POSTGRES_PASSWORD: ${CANTON_DB_PASSWORD:-supersecret}
    ports:
      - "${CANTON_DB_PORT:-5432}:5432"
    volumes:
      - canton_pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CANTON_DB_USER:-canton}"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: canton_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - canton_prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: canton_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - canton_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  canton_pgdata:
  canton_prometheus_data:
  canton_grafana_data:
