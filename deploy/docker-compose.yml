# =============================================================================
# Canton Global Synchronizer (DevNet) - Monitoring & UI Overlay
# =============================================================================
# The Splice Validator Node (Participant + PostgreSQL + nginx) is managed by
# the Splice bundle's own compose file in splice-node/.
# This compose file adds Prometheus, Grafana, and the Asset Transfer UI.
# =============================================================================

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: canton_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - canton_prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: canton_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - canton_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  canton_prometheus_data:
  canton_grafana_data:
