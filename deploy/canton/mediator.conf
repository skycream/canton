// Canton Mediator Node Configuration

include required("storage.conf")
include required("tls.conf")
include required("monitoring.conf")

canton {
  mediators {
    mediator1 {
      storage = ${_shared_storage}
      storage.config.properties.databaseName = "canton_mediator"
      storage.config.properties.databaseName = ${?CANTON_MEDIATOR_DB}

      admin-api {
        address = "127.0.0.1"
        port = 5017
        port = ${?CANTON_MEDIATOR_ADMIN_PORT}

        tls = ${_tls_config}
      }
    }
  }
}
