// Canton Participant Node Configuration
// Includes: storage.conf, auth.conf, tls.conf, monitoring.conf

include required("storage.conf")
include required("auth.conf")
include required("tls.conf")
include required("monitoring.conf")

canton {
  participants {
    participant1 {
      storage = ${_shared_storage}
      storage.config.properties.databaseName = "canton_participant"
      storage.config.properties.databaseName = ${?CANTON_PARTICIPANT_DB}

      ledger-api {
        address = "0.0.0.0"
        port = 5011
        port = ${?CANTON_LEDGER_API_PORT}

        tls = ${_tls_config}

        auth-services = ${_auth_services}
      }

      admin-api {
        address = "127.0.0.1"
        port = 5012
        port = ${?CANTON_PARTICIPANT_ADMIN_PORT}

        tls = ${_tls_config}
      }

      parameters {
        initial-protocol-version = 31
      }
    }
  }
}
