// Canton Sequencer Node Configuration
// Database-backed sequencer with HA support.

include required("storage.conf")
include required("tls.conf")
include required("monitoring.conf")

canton {
  sequencers {
    sequencer1 {
      storage = ${_shared_storage}
      storage.config.properties.databaseName = "canton_sequencer"
      storage.config.properties.databaseName = ${?CANTON_SEQUENCER_DB}

      sequencer {
        type = database
        high-availability.enabled = true
        high-availability.enabled = ${?CANTON_SEQUENCER_HA}
      }

      public-api {
        address = "0.0.0.0"
        port = 5018
        port = ${?CANTON_SEQUENCER_PUBLIC_PORT}

        tls = ${_tls_config}
      }

      admin-api {
        address = "127.0.0.1"
        port = 5019
        port = ${?CANTON_SEQUENCER_ADMIN_PORT}

        tls = ${_tls_config}
      }
    }
  }
}
