// Canton PostgreSQL Storage Configuration
// Shared by participant, sequencer, and mediator nodes.
// Override via environment variables for each deployment.

canton.parameters.non-standard-config = yes

_shared_storage {
  type = postgres
  config {
    dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
    properties {
      serverName = "localhost"
      serverName = ${?CANTON_DB_HOST}
      portNumber = 5432
      portNumber = ${?CANTON_DB_PORT}
      user = "canton"
      user = ${?CANTON_DB_USER}
      password = "supersecret"
      password = ${?CANTON_DB_PASSWORD}
    }
  }
  parameters {
    migrate-and-start = yes
  }
}
