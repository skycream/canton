// Canton TLS / mTLS Configuration
// Applied to Ledger API, Admin API, and Public API endpoints.

_tls_config {
  cert-chain-file = "./tls/certs/server.crt"
  cert-chain-file = ${?CANTON_TLS_CERT}

  private-key-file = "./tls/certs/server.key"
  private-key-file = ${?CANTON_TLS_KEY}

  trust-collection-file = "./tls/certs/ca.crt"
  trust-collection-file = ${?CANTON_TLS_CA_CERT}

  client-auth {
    type = require
    type = ${?CANTON_TLS_CLIENT_AUTH}
  }

  minimum-server-protocol-version = "TLSv1.3"
  minimum-server-protocol-version = ${?CANTON_TLS_MIN_VERSION}

  ciphers = null
}

// Admin API client TLS configuration (for mTLS connections to admin endpoints)
_admin_client_tls {
  cert-chain-file = "./tls/certs/admin-client.crt"
  cert-chain-file = ${?CANTON_TLS_ADMIN_CLIENT_CERT}

  private-key-file = "./tls/certs/admin-client.key"
  private-key-file = ${?CANTON_TLS_ADMIN_CLIENT_KEY}

  trust-collection-file = "./tls/certs/ca.crt"
  trust-collection-file = ${?CANTON_TLS_CA_CERT}
}
