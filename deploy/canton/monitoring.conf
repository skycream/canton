// Canton Monitoring Configuration
// Prometheus metrics endpoint and JVM metrics.
//
// Each node must override the ports to avoid conflicts when co-located:
//   participant: CANTON_METRICS_PORT=9000, CANTON_HEALTH_PORT=9001
//   sequencer:   CANTON_METRICS_PORT=9002, CANTON_HEALTH_PORT=9003
//   mediator:    CANTON_METRICS_PORT=9004, CANTON_HEALTH_PORT=9005

canton {
  monitoring {
    metrics {
      reporters = [
        {
          type = prometheus
          address = "0.0.0.0"
          port = 9000
          port = ${?CANTON_METRICS_PORT}
        }
      ]
      jvm-metrics.enabled = true
    }

    health {
      server {
        address = "0.0.0.0"
        port = 9001
        port = ${?CANTON_HEALTH_PORT}
      }
    }
  }
}
